<style>
  :root{
    --ink:#080B14;
    --panel:#111727;
    --panel-2:#19213A;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.16);
    --text:#EAEEF7;
    --muted:#8B95AC;
    --faint:#5B637A;
    --live:#FF2D55;
    --next:#26E5B0;
    --amber:#FFC23D;
    --violet:#7B5CFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(123,92,255,.18), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(255,45,85,.12), transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:0 0 80px;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* ---- masthead ---- */
  header.top{padding:38px 0 10px}
  .eyebrow{
    font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;
  }
  .eyebrow .pip{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(255,45,85,.6);animation:pip 2s infinite}
  @keyframes pip{0%{box-shadow:0 0 0 0 rgba(255,45,85,.5)}70%{box-shadow:0 0 0 9px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}
  h1{
    font-family:'Anton',sans-serif;font-weight:400;
    font-size:clamp(34px,7vw,68px);line-height:.94;letter-spacing:.01em;
    text-transform:uppercase;margin:14px 0 6px;
  }
  h1 .yr{color:var(--amber)}
  .sub{color:var(--muted);max-width:60ch;font-size:15px}
  .sub b{color:var(--text);font-weight:600}

  /* ---- broadcast desk hero ---- */
  .desk{
    margin:26px 0 8px;border:1px solid var(--line-strong);border-radius:18px;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    overflow:hidden;position:relative;
  }
  .desk::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg, rgba(255,45,85,.10), transparent 40%)}
  .desk.is-next::before{background:linear-gradient(90deg, rgba(38,229,176,.10), transparent 40%)}
  .desk-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 22px;border-bottom:1px solid var(--line);position:relative;
  }
  .status{
    font-family:'Space Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;display:flex;align-items:center;gap:10px;
  }
  .dot{width:10px;height:10px;border-radius:50%}
  .status.live{color:var(--live)}
  .status.live .dot{background:var(--live);animation:pip 1.4s infinite}
  .status.next{color:var(--next)}
  .status.next .dot{background:var(--next)}
  .status.done{color:var(--muted)}
  .status.done .dot{background:var(--muted)}
  .desk-clock{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:.05em}

  .desk-body{padding:24px 22px 22px;display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center}
  .match-line{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .team{display:flex;align-items:center;gap:12px;min-width:0}
  .team .flag{font-size:34px;line-height:1}
  .team .nm{font-family:'Anton',sans-serif;font-size:clamp(22px,4.4vw,38px);text-transform:uppercase;letter-spacing:.01em}
  .vs{font-family:'Space Mono',monospace;color:var(--muted);font-size:14px;font-weight:700;padding:0 2px}
  .desk-meta{margin-top:14px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 16px}
  .desk-meta .label{color:var(--text);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .chip{
    font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.05em;
    padding:5px 9px;border-radius:7px;border:1px solid var(--line-strong);color:var(--text);
    background:rgba(255,255,255,.04)
  }
  .chip.ctv{color:#7ec8ff;border-color:rgba(126,200,255,.35)}
  .chip.crave{color:#c9a6ff;border-color:rgba(201,166,255,.35)}

  /* countdown */
  .count{justify-self:end;text-align:right}
  .count .cap{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .clock{display:flex;gap:8px}
  .seg{min-width:62px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
  .seg .n{font-family:'Anton',sans-serif;font-size:30px;line-height:1;color:var(--next);font-variant-numeric:tabular-nums}
  .seg .u{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:5px}
  .desk.is-live .seg .n{color:var(--live)}
  .live-msg{font-family:'Anton',sans-serif;font-size:28px;text-transform:uppercase;color:var(--live)}

  /* ---- controls ---- */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 8px}
  .btn{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;
    padding:9px 14px;border-radius:10px;border:1px solid var(--line-strong);
    background:var(--panel);color:var(--text);transition:.15s;
  }
  .btn:hover{border-color:var(--next);color:var(--next)}
  .btn:focus-visible{outline:2px solid var(--next);outline-offset:2px}
  .toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--panel)}
  .toggle button{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;padding:9px 13px;border:0;background:transparent;color:var(--muted);cursor:pointer}
  .toggle button[aria-pressed="true"]{background:var(--next);color:#04150F}
  .tznote{font-size:12px;color:var(--faint);font-family:'Space Mono',monospace}

  /* ---- schedule ---- */
  section.stage{margin-top:34px}
  .stage-title{
    font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(18px,3vw,26px);
    letter-spacing:.02em;display:flex;align-items:baseline;gap:12px;padding-bottom:10px;
    border-bottom:2px solid var(--line-strong);
  }
  .stage-title .ct{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.05em}

  .daygroup{margin-top:14px}
  .dayhdr{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:10px}
  .dayhdr::after{content:"";flex:1;height:1px;background:var(--line)}

  .row{
    display:grid;grid-template-columns:88px 1fr 200px;gap:14px;align-items:center;
    padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
    background:var(--panel);transition:.15s;position:relative;scroll-margin-top:20px;
  }
  .row:hover{border-color:var(--line-strong)}
  .row .time{font-family:'Space Mono',monospace;font-size:14px;color:var(--text);font-weight:700}
  .row .time .tz{display:block;font-size:10px;color:var(--faint);font-weight:400;letter-spacing:.05em;margin-top:2px}
  .row .fixture{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
  .row .side{display:flex;align-items:center;gap:8px}
  .row .side .flag{font-size:21px}
  .row .side .nm{font-weight:600;font-size:15px}
  .row .mvs{font-family:'Space Mono',monospace;color:var(--muted);font-size:12px}
  .row .single{font-weight:700;font-size:15px;letter-spacing:.02em}
  .row .nets{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .row .net{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
  .row .net.ctv{color:#7ec8ff}
  .row .net.crave{color:#c9a6ff}
  .row .venue{font-size:12px;color:var(--faint);width:100%;margin-top:2px}

  .badge{position:absolute;top:-9px;left:14px;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
  .row.live{border-color:var(--live);box-shadow:0 0 0 1px var(--live),0 10px 30px -10px rgba(255,45,85,.5);background:linear-gradient(180deg,rgba(255,45,85,.10),var(--panel))}

  .row.live .badge::before{content:"● "}
  .row.next{border-color:var(--next);box-shadow:0 0 0 1px var(--next),0 10px 30px -12px rgba(38,229,176,.45);background:linear-gradient(180deg,rgba(38,229,176,.08),var(--panel))}
  .row.next .badge{background:var(--next);color:#04150F}
  .row.done{opacity:.5}
  .row.done .time{color:var(--muted)}

  footer{margin-top:50px;padding-top:20px;border-top:1px solid var(--line);color:var(--faint);font-size:12px;font-family:'Space Mono',monospace;line-height:1.7}
  footer a{color:var(--muted)}

  @media (max-width:720px){
    .desk-body{grid-template-columns:1fr}
    .count{justify-self:start;text-align:left}
    .row{grid-template-columns:70px 1fr;gap:10px}
    .row .nets{grid-column:1/-1;justify-content:flex-start;margin-top:4px}
    .row .venue{grid-column:1/-1}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;scroll-behavior:auto!important}
  }
</style>
</head>

const LIVE_MS = 2.5*60*60*1000;
let useLocal = false;

const matches = M.map((m,i)=>({
  id:i, stage:m[0], start:new Date(m[1]).getTime(),
  t1:m[2], t2:m[3], venue:m[4], nets:m[5].split('/').map(s=>s.trim())
}));

/* ---------- 时间格式 ---------- */
function fmtTime(ms){
  const opt={hour:'numeric',minute:'2-digit',hour12:true};
  if(useLocal){
    return new Intl.DateTimeFormat('zh-Hans',opt).format(ms);
  }
  return new Intl.DateTimeFormat('en-US',{...opt,timeZone:'America/New_York'}).format(ms);
}
function fmtDay(ms){
  const opt={weekday:'long',month:'long',day:'numeric'};
  if(useLocal) return new Intl.DateTimeFormat('zh-Hans',{...opt}).format(ms);
  return new Intl.DateTimeFormat('zh-Hans',{...opt,timeZone:'America/New_York'}).format(ms);
}
function dayKey(ms){
  const f=new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:useLocal?undefined:'America/New_York'});
  return f.format(ms);
}

/* ---------- 状态：找当前/下一场 ---------- */
function compute(){
  const now=Date.now();
  let live=matches.filter(m=>now>=m.start && now<m.start+LIVE_MS);
  let next=matches.filter(m=>m.start>now).sort((a,b)=>a.start-b.start)[0];
  return {now,live,next};
}

/* ---------- 渲染时间表 ---------- */
function netClass(n){ if(/CTV/i.test(n))return 'ctv'; if(/Crave/i.test(n))return 'crave'; return ''; }
function sideHTML(name){
  const isCode=!ZH[name] && !/place|final|季军|决赛/i.test(name);
  if(name===null) return '';
  if(/3rd|Final|季军|决赛/.test(name)){ return `<div class="single">${name}</div>`; }
  if(ZH[name]){ return `<div class="side"><span class="flag">${flag(name)}</span><span class="nm">${zh(name)}</span></div>`; }
  return `<div class="side"><span class="nm" style="font-family:'Space Mono',monospace;color:var(--muted)">${name}</span></div>`;
}

function renderSchedule(state){
  const root=document.getElementById('schedule');
  root.innerHTML='';
  const stages=[...new Set(matches.map(m=>m.stage))];
  stages.forEach(st=>{
    const list=matches.filter(m=>m.stage===st);
    const sec=document.createElement('section');
    sec.className='stage';
    sec.innerHTML=`<div class="stage-title">${st}<span class="ct">${list.length} 场</span></div>`;
    let curDay=null,dayWrap=null;
    list.forEach(m=>{
      const dk=dayKey(m.start);
      if(dk!==curDay){
        curDay=dk;
        dayWrap=document.createElement('div');
        dayWrap.className='daygroup';
        dayWrap.innerHTML=`<div class="dayhdr">${fmtDay(m.start)}</div>`;
        sec.appendChild(dayWrap);
      }
      const now=state.now;
      const isLive=now>=m.start && now<m.start+LIVE_MS;
      const isNext=state.next && m.id===state.next.id && state.live.length===0;
      const isDone=now>=m.start+LIVE_MS;
      let cls='row'+(isLive?' live':'')+(isNext?' next':'')+(isDone&&!isLive?' done':'');
      let badge = isLive?'<span class="badge">直播中</span>': isNext?'<span class="badge">下一场</span>':'';
      const nets=m.nets.map(n=>`<span class="net ${netClass(n)}">${n}</span>`).join('');
      const fixture = m.t2===null
        ? `<div class="fixture">${sideHTML(m.t1)}<div class="venue">${m.venue}</div></div>`
        : `<div class="fixture">${sideHTML(m.t1)}<span class="mvs">vs</span>${sideHTML(m.t2)}<div class="venue">${m.venue}</div></div>`;
      const row=document.createElement('div');
      row.className=cls;
      row.id='m'+m.id;
      row.innerHTML=`${badge}
        <div class="time">${fmtTime(m.start)}<span class="tz">${useLocal?'本地':'ET'}</span></div>
        ${fixture}
        <div class="nets">${nets}</div>`;
      dayWrap.appendChild(row);
    });
    root.appendChild(sec);
  });
}

/* ---------- 渲染控制台 ---------- */
let featuredId=null;
function renderDesk(state){
  const desk=document.getElementById('desk');
  const stEl=document.getElementById('status');
  const stText=document.getElementById('statusText');
  const fx=document.getElementById('deskFixture');
  const meta=document.getElementById('deskMeta');
  const chips=document.getElementById('deskChips');
  const cap=document.getElementById('countCap');
  const cc=document.getElementById('countContent');

  let m, mode;
  if(state.live.length>0){ m=state.live[0]; mode='live'; }
  else if(state.next){ m=state.next; mode='next'; }
  else { mode='done'; }

  desk.classList.toggle('is-live',mode==='live');
  desk.classList.toggle('is-next',mode==='next');

  if(mode==='done'){
    stEl.className='status done'; stText.textContent='赛事已结束';
    fx.innerHTML='<div class="team"><span class="nm">2026 世界杯 已闭幕</span></div>';
    meta.innerHTML=''; chips.innerHTML=''; cap.textContent=''; cc.innerHTML='';
    featuredId=null; return;
  }
  featuredId=m.id;

  // fixture big
  function big(name){
    if(name===null) return '';
    if(/3rd|Final|季军|决赛/.test(name)) return `<div class="team"><span class="nm">${name}</span></div>`;
    if(ZH[name]) return `<div class="team"><span class="flag">${flag(name)}</span><span class="nm">${zh(name)}</span></div>`;
    return `<div class="team"><span class="nm" style="color:var(--muted)">${name}</span></div>`;
  }
  fx.innerHTML = m.t2===null ? big(m.t1) : `${big(m.t1)}<span class="vs">VS</span>${big(m.t2)}`;

  meta.innerHTML=`<span><span class="label">${m.stage}</span></span><span>📍 ${m.venue}</span><span>🕒 ${fmtTime(m.start)} ${useLocal?'本地时间':'ET'} · ${fmtDay(m.start)}</span>`;
  chips.innerHTML='<span style="color:var(--muted);font-size:13px;align-self:center;margin-right:4px">在哪看：</span>'+
    m.nets.map(n=>`<span class="chip ${netClass(n)}">${n}</span>`).join('');

  if(mode==='live'){
    stEl.className='status live';
    stText.textContent = state.live.length>1 ? `正在直播 · 同时 ${state.live.length} 场` : '正在直播';
    cap.textContent='本场已开赛';
    const elapsed=state.now - m.start;
    cc.innerHTML=`<div class="live-msg">ON&nbsp;AIR</div>`;
    cc.insertAdjacentHTML('beforeend',`<div style="font-family:'Space Mono',monospace;color:var(--muted);font-size:12px;margin-top:6px">已进行 ${Math.floor(elapsed/60000)} 分钟</div>`);
  } else {
    stEl.className='status next'; stText.textContent='下一场';
    cap.textContent='距离开赛';
    cc.innerHTML=segHTML(m.start-state.now);
  }
}
function segHTML(diff){
  diff=Math.max(0,diff);
  const d=Math.floor(diff/86400000);
  const h=Math.floor(diff%86400000/3600000);
  const mi=Math.floor(diff%3600000/60000);
  const s=Math.floor(diff%60000/1000);
  const seg=(n,u)=>`<div class="seg"><div class="n">${String(n).padStart(2,'0')}</div><div class="u">${u}</div></div>`;
  return (d>0?seg(d,'天'):'')+seg(h,'时')+seg(mi,'分')+seg(s,'秒');
}

/* ---------- 主循环 ---------- */
let lastFeatured=null;
function tick(){
  const state=compute();
  const clock=new Intl.DateTimeFormat(useLocal?'zh-Hans':'en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:useLocal?undefined:'America/New_York'}).format(Date.now());
  document.getElementById('deskClock').textContent=(useLocal?'本地 ':'ET ')+clock;
  renderDesk(state);
  // 仅当高亮目标变化时重绘整张表，避免每秒刷新
  const key=state.live.map(m=>m.id).join(',')+'|'+(state.next?state.next.id:'x');
  if(key!==lastFeatured){ renderSchedule(state); lastFeatured=key; }
}

/* ---------- 控制 ---------- */
function setTZ(local){
  useLocal=local;
  document.getElementById('tzET').setAttribute('aria-pressed',String(!local));
  document.getElementById('tzLocal').setAttribute('aria-pressed',String(local));
  lastFeatured=null; tick();
}
document.getElementById('tzET').onclick=()=>setTZ(false);
document.getElementById('tzLocal').onclick=()=>setTZ(true);
document.getElementById('jumpBtn').onclick=()=>{
  if(featuredId!==null){
    const el=document.getElementById('m'+featuredId);
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  }
};
// 本地时区名
try{
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.getElementById('tzNote').textContent='你的时区：'+tz;
}catch(e){}

tick();
setInterval(tick,1000);
</script>
